  <style>
    :root {
      --green-dark: #065f46;
      --green-mid: #059669;
      --green-light: #d1fae5;
      --green-xlight: #ecfdf5;
    }
    * { font-family: 'DM Sans', sans-serif; }
    h1, h2, h3, .display { font-family: 'Sora', sans-serif; }

    .hero-bg {
      background: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #065f46 100%);
      position: relative;
      overflow: hidden;
    }
    .hero-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 20% 50%, rgba(16,185,129,0.15) 0%, transparent 60%),
                        radial-gradient(circle at 80% 20%, rgba(52,211,153,0.10) 0%, transparent 50%);
    }
    .hero-bg::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0; right: 0;
      height: 60px;
      background: white;
      clip-path: ellipse(55% 100% at 50% 100%);
    }

    .stat-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      transition: background 0.2s;
    }
    .stat-card:hover { background: rgba(255,255,255,0.14); }

    .feature-card {
      border: 1.5px solid #d1fae5;
      border-radius: 20px;
      transition: all 0.25s ease;
      background: white;
    }
    .feature-card:hover {
      border-color: #059669;
      transform: translateY(-3px);
      box-shadow: 0 12px 32px -8px rgba(5,150,105,0.18);
    }

    .icon-badge {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .timeline-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #059669;
      border: 3px solid white;
      box-shadow: 0 0 0 3px #059669;
      flex-shrink: 0;
    }
    .timeline-line {
      width: 2px;
      background: linear-gradient(to bottom, #059669, #d1fae5);
      flex-shrink: 0;
    }

    .partner-chip {
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      border-radius: 100px;
      padding: 10px 22px;
      font-weight: 500;
      color: #065f46;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .partner-chip:hover {
      background: #d1fae5;
      border-color: #059669;
    }

</head>
